
spring.application.name=backend

# Server
server.port=${PORT:8080}
server.servlet.context-path=/api

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/splitmate}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# JWT
jwt.secret=${JWT_SECRET:splitmate-super-secret-key-change-in-production-min-256-bits}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Flyway
spring.flyway.enabled=false

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Gmail API
gmail.client.id=${GMAIL_CLIENT_ID:test}

gmail.client.secret=${GMAIL_CLIENT_SECRET:test}

gmail.refresh.token=${GMAIL_REFRESH_TOKEN:test}

gmail.sender.email=${GMAIL_SENDER_EMAIL:test@gmail.com}

# App Base URL
app.base-url=${APP_BASE_URL:http://localhost:5173}

# Logging
logging.level.com.splitmate=INFO
logging.level.org.springframework.security=WARN

