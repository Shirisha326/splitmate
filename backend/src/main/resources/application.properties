spring.application.name=backend

# Server
server.port=${PORT:8080}
server.servlet.context-path=/api

# MySQL Database - Railway compatible
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# Connection Pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# JWT
jwt.secret=${JWT_SECRET:splitmate-super-secret-key-change-in-production-min-256-bits}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Flyway
spring.flyway.enabled=false

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:splitmateapp2025@gmail.com}
spring.mail.password=${MAIL_PASSWORD:bjxrzmycgfwhefxn}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# App base URL
app.base-url=${APP_BASE_URL:http://localhost:5173}

# Logging
logging.level.com.splitmate=INFO
logging.level.org.springframework.security=WARN