spring.application.name=backend

# =====================================
# Server
# =====================================

server.port=8080
server.servlet.context-path=/api


# =====================================
# Database
# =====================================

spring.datasource.url=jdbc:mysql://localhost:3306/splitmate
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =====================================
# Connection Pool
# =====================================

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2


# =====================================
# JPA / Hibernate
# =====================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false


# =====================================
# JWT
# =====================================

jwt.secret=splitmate-super-secret-key-change-in-production-min-256-bits
jwt.expiration=86400000


# =====================================
# Flyway
# =====================================

spring.flyway.enabled=false


# =====================================
# CORS
# =====================================

app.cors.allowed-origins=http://localhost:5173


# =====================================
# Mailjet Configuration
# =====================================

mailjet.api-key=0ae3d9b722ae42a8ca9dcc7962854d3d

mailjet.secret-key=41c13b6f9ad708963d86959682a95b5b

mailjet.from-email=splitmateapp2025@gmail.com

mailjet.from-name=SplitMate


# =====================================
# Frontend Base URL
# =====================================

app.base-url=http://localhost:5173


# =====================================
# Logging
# =====================================

logging.level.com.splitmate=INFO
logging.level.org.springframework.security=WARN