spring.application.name=backend

server.port=${PORT:8080}
server.servlet.context-path=/api

# =========================
# DATABASE
# =========================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# HIKARI CONNECTION POOL
# =========================

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# =========================
# JPA / HIBERNATE
# =========================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# =========================
# JWT
# =========================

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# =========================
# FLYWAY
# =========================

spring.flyway.enabled=false

# =========================
# CORS
# =========================

app.cors.allowed-origins=https://splitmate-gules.vercel.app

# =========================
# MAILJET
# =========================

mailjet.api-key=${MAILJET_API_KEY}
mailjet.secret-key=${MAILJET_SECRET_KEY}
mailjet.from-email=splitmateapp2025@gmail.com
mailjet.from-name=SplitMate

# =========================
# FRONTEND URL
# =========================

app.base-url=https://splitmate-gules.vercel.app

# =========================
# LOGGING
# =========================

logging.level.com.splitmate=INFO
logging.level.org.springframework.security=WARN